<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura WebRTC</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f1419;
            --panel: #1a222c;
            --text: #e7eef7;
            --muted: #9db0c5;
            --accent: #3dd6c6;
        }
        body {
            margin: 0;
            font-family: "Segoe UI", "Helvetica Neue", sans-serif;
            background: radial-gradient(circle at top, #1b2735, var(--bg));
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }
        h1 {
            margin: 0 0 8px;
            font-weight: 600;
            letter-spacing: 0.04em;
        }
        #status {
            color: var(--muted);
            margin-bottom: 16px;
        }
        .videos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        video, img {
            width: 100%;
            background: var(--panel);
            border-radius: 8px;
            aspect-ratio: 4 / 3;
            object-fit: cover;
        }
        #capturedImage {
            display: none;
            border: 1px solid #334155;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        button {
            background: var(--accent);
            color: #04201d;
            border: 0;
            border-radius: 6px;
            padding: 10px 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Aura</h1>
    <div id="status">Connecting to signaling…</div>

    <div class="controls">
        <button id="startCall" disabled>Start Call</button>
        <button id="captureImage" disabled>Capture Face</button>
    </div>

    <div class="videos">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <img id="capturedImage" alt="Captured frame" />

    <script src="app.js"></script>
</body>
</html>
